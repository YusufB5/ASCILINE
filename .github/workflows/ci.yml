name: ASCILINE CI

# NOTE: This pipeline is currently codec-focused.
# It verifies Python↔JS bit-exact correctness across all codec tags (RAW, ZLIB, DELTA,
# RLE_FULL, DCT) and runs the existing pytest suite.
# We also include E2E tests that test WebSocket streaming, backpressure, and jitter timing.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Node.cjs
      uses: actions/setup-node@v7
      with:
        node-version: '20'

    - name: Install System Dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Install System Dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: choco install ffmpeg -y

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest numpy opencv-python aiohttp Pillow fastapi uvicorn websockets yt-dlp

    - name: Install JS Dependencies
      run: npm install ws

    - name: Run Flake8 (Fatal Errors Only)
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run Pytest Suite
      run: pytest test/

    - name: Generate Synthetic Test Videos
      shell: bash
      run: bash experiments/make_test_clips.sh

    - name: Bit-Exact Test (Tags 1-3)
      run: |
        python experiments/gen_vectors.py
        node experiments/check_vectors.cjs

    - name: Bit-Exact Test (Tag 4 DCT)
      run: |
        python experiments/profile_vectors.py
        node experiments/check_profile.cjs

    - name: Run JS E2E and Backpressure Tests
      shell: bash
      run: |
        # Wait a bit after setting up environment
        sleep 2
        
        echo "Running E2E test..."
        # Start the backend server with a test clip in the background
        python stream_server.py videos/test.mp4 --port 8011 &
        SERVER_PID=$!
        
        # Wait a moment for server to bind
        sleep 5
        
        node test/test_e2e.cjs 8011 60
        kill $SERVER_PID
        wait $SERVER_PID 2>/dev/null || true
        
        echo "Running Backpressure Live test..."
        node test/test_backpressure_live.cjs
        
        echo "Running Backpressure Gap test..."
        node test/test_backpressure_gap.cjs
        
        echo "Running Close Code test..."
        node test/test_close_code.cjs

    - name: SDK Import Smoke Test
      run: node test/test_sdk_import.js

  # Optional Rust engine (rust_core/). Kept apart from `test` so a native build
  # problem never hides Python results. Fails if any native test skips.
  native:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ffmpeg: ffmpeg-n8.1-latest-linux64-lgpl-shared-8.1
            archive: tar.xz
          - os: windows-latest
            ffmpeg: ffmpeg-n8.1-latest-win64-lgpl-shared-8.1
            archive: zip
    env:
      CARGO_TERM_COLOR: always
      NATIVE_TESTS: >-
        test/test_sdk_profile.py test/test_engine_selection.py test/test_native_engine.py
        test/test_live_profile.py test/test_playback_recording.py test/test_native_stream.py
    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'

    # test_live_profile/test_native_stream validate wire output with the shipped JS codec.
    - name: Set up Node.cjs
      uses: actions/setup-node@v7
      with:
        node-version: '20'

    - name: Set up Rust stable
      run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

    - name: Cache Cargo registry and target
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          rust_core/target
        key: native-${{ runner.os }}-${{ hashFiles('rust_core/Cargo.lock') }}
        restore-keys: native-${{ runner.os }}-

    # Stable n8.1 branch shared dev build (include/, lib/, bin/); ffmpeg-next 8
    # needs FFmpeg 8 headers, which apt/choco do not guarantee.
    - name: Install FFmpeg 8.1 shared development package
      run: |
        url="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/${{ matrix.ffmpeg }}.${{ matrix.archive }}"
        mkdir -p "$RUNNER_TEMP/ffmpeg"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/ffmpeg/pkg.${{ matrix.archive }}" "$url"
        cd "$RUNNER_TEMP/ffmpeg"
        if [ "${{ matrix.archive }}" = zip ]; then 7z x -bso0 pkg.zip; else tar -xJf pkg.tar.xz; fi
        root="$RUNNER_TEMP/ffmpeg/${{ matrix.ffmpeg }}"
        if [ "$RUNNER_OS" = Windows ]; then root="$(cygpath -w "$root")"; fi
        echo "FFMPEG_DIR=$root" >> "$GITHUB_ENV"
        echo "$root/bin" >> "$GITHUB_PATH"
        if [ "$RUNNER_OS" = Linux ]; then echo "LD_LIBRARY_PATH=$root/lib" >> "$GITHUB_ENV"; fi

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest numpy opencv-python aiohttp Pillow fastapi uvicorn websockets

    - name: Install JS Dependencies
      run: npm install ws

    - name: Fetch crates
      run: cargo fetch --locked --manifest-path rust_core/Cargo.toml

    - name: Rust unit tests (SIMD SAD vs scalar)
      run: python rust_core/build.py --test

    - name: Build native engine
      run: python rust_core/build.py

    - name: Verify rust engine loads without fallback
      run: |
        python -m asciline.engines --engine rust | tee engine.json
        python -c "import json; e = json.load(open('engine.json')); assert e['engine'] == 'rust' and e['fallback_reason'] is None, e"

    - name: Native pytest (no skips allowed)
      run: |
        python -m pytest -q -rs $NATIVE_TESTS --junitxml=native.xml
        python - <<'EOF'
        import xml.etree.ElementTree as ET
        skipped = [f"{c.get('classname')}::{c.get('name')}: {s.get('message')}"
                   for c in ET.parse("native.xml").iter("testcase") for s in c.findall("skipped")]
        if skipped:
            raise SystemExit("Native tests skipped:\n" + "\n".join(skipped))
        print("No native tests skipped.")
        EOF
