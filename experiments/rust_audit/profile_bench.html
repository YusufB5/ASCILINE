<!doctype html>
<html lang="en"><meta charset="utf-8"><title>ASCILINE DCT decode benchmark</title>
<style>body{font:16px system-ui;background:#111;color:#ddd;margin:30px}button{padding:12px}canvas{display:block;margin:20px 0}pre{white-space:pre-wrap}</style>
<h1>DCT decode and Canvas timing</h1>
<p>This measures sequential decode/draw work, not real-time playback or audio synchronization.</p>
<button id="run">Run benchmark</button><canvas id="canvas"></canvas><pre id="result">Ready</pre>
<script src="codec.js"></script>
<script>
run.onclick = async () => {
  run.disabled = true; result.textContent = 'Running…';
  try {
    const meta = await (await fetch('meta.json')).json();
    const input = new Uint8Array(await (await fetch('packets.bin')).arrayBuffer());
    const view = new DataView(input.buffer), ctx = canvas.getContext('2d');
    canvas.width = meta.cols; canvas.height = meta.rows;
    const rgba = ctx.createImageData(meta.cols, meta.rows);
    for (let i = 3; i < rgba.data.length; i += 4) rgba.data[i] = 255;
    const decoder = AscilineCodec.makeDecoder(3), decode = [], draw = [];
    let off = 0;
    for (let i = 0; i < meta.frames; i++) {
      const size = view.getUint32(off); off += 4;
      const packet = input.slice(off, off + size); off += size;
      const begin = performance.now();
      const { frame, frameIndex } = await decoder.decode(packet);
      const decoded = performance.now();
      if (frameIndex !== i || frame.length !== meta.cols * meta.rows * 3) throw Error('Frame mismatch');
      for (let s = 0, d = 0; s < frame.length; s += 3, d += 4) {
        rgba.data[d] = frame[s + 2]; rgba.data[d + 1] = frame[s + 1]; rgba.data[d + 2] = frame[s];
      }
      ctx.putImageData(rgba, 0, 0);
      decode.push(decoded - begin); draw.push(performance.now() - decoded);
      const hash = [...new Uint8Array(await crypto.subtle.digest('SHA-256', frame))]
        .map(v => v.toString(16).padStart(2, '0')).join('');
      if (hash !== meta.hashes[i]) throw Error('Reconstruction mismatch at ' + i);
    }
    const stats = values => {
      const ordered = values.toSorted((a, b) => a - b);
      return { mean: values.reduce((a, b) => a + b) / values.length,
        p95: ordered[Math.floor(values.length * .95)], max: ordered.at(-1) };
    };
    result.textContent = JSON.stringify({ verified_frames: meta.frames, cols: meta.cols, rows: meta.rows,
      browser_decode_ms: stats(decode), bgr_canvas_ms: stats(draw),
      combined_ms: stats(decode.map((value, i) => value + draw[i])) }, null, 2);
  } catch (error) { result.textContent = String(error); }
  finally { run.disabled = false; }
};
</script></html>
